<style>
  .gate { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .gate__lock { width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(139,108,255,.25), rgba(34,211,238,.15)); border: 1px solid var(--border-2); color: #c9bcff; font-size: 24px; }
  .gate h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
  .gate p { color: var(--muted); font-size: 15px; margin-top: 8px; }
  .gate form { display: grid; gap: 12px; margin-top: 26px; }
  .gate .input { text-align: center; }
  .gate__error { color: #ff8f8f; font-size: 14px; min-height: 20px; }
  .gate.is-shaking .gate__card { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>

  const KEY_STORE = 'pdmedia-vorschau-schluessel';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const gate = document.getElementById('gate');
  const form = document.getElementById('gateForm');
  const input = document.getElementById('gatePw');
  const btn = document.getElementById('gateBtn');
  const err = document.getElementById('gateError');

  async function deriveKey(pw) {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.it, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function unlock(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    const app = document.getElementById('app');
    app.innerHTML = new TextDecoder().decode(plain);
    gate.remove();
    document.querySelectorAll('body > .bg-glow, body > .bg-grid').forEach((el) => el.remove());
    app.hidden = false;
    const s = document.createElement('script');
    s.src = 'script.js';
    document.body.appendChild(s);
    if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView(), 50);
    return key;
  }

  if (!window.crypto?.subtle) {
    err.textContent = 'Ihr Browser kann diese geschützte Seite nicht öffnen. Bitte einen aktuellen Browser verwenden.';
    btn.disabled = true;
    return;
  }

  // Bereits entsperrt in diesem Tab? Dann direkt öffnen.
  let saved = null;
  try { saved = sessionStorage.getItem(KEY_STORE); } catch {}
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt'])
      .then(unlock)
      .catch(() => { try { sessionStorage.removeItem(KEY_STORE); } catch {} });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Wird geöffnet …';
    try {
      const key = await deriveKey(input.value);
      await unlock(key);
      try { sessionStorage.setItem(KEY_STORE, toB64(await crypto.subtle.exportKey('raw', key))); } catch {}
    } catch {
      err.textContent = 'Das Passwort stimmt nicht. Bitte prüfen Sie Groß- und Kleinschreibung.';
      btn.disabled = false;
      btn.textContent = 'Seite öffnen';
      gate.classList.remove('is-shaking'); void gate.offsetWidth; gate.classList.add('is-shaking');
      input.select();
    }
  });
})();
