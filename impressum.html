<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum – Creator Hub</title>
<style>
  :root {
    --bg: #0d0616;
    --card: #1a1028;
    --text: #f5f3fa;
    --muted: #a99fc0;
    --accent: #7c3aed;
    --accent-2: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }
  img { display: block; max-width: 100%; }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13, 6, 22, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-wrap {
    position: relative;
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
  }
  .logo img { height: 36px; transition: transform 0.6s ease; }
  .logo:hover img { transform: rotate(360deg); }
  nav ul { display: flex; gap: 30px; }
  nav a {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--muted);
    transition: color 0.2s;
  }
  nav a:hover { color: var(--text); }
  .burger { display: none; font-size: 24px; background: none; border: none; color: var(--text); cursor: pointer; }

  .legal-content {
    max-width: 820px;
    margin: 0 auto;
    padding: 90px 24px 120px;
  }
  .legal-content .eyebrow {
    color: var(--accent-2);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .legal-content h1 { font-size: 38px; margin: 10px 0 24px; }
  .legal-content p { color: var(--muted); font-size: 15px; line-height: 1.7; }

  footer {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 48px 24px 24px;
  }
  .footer-inner { max-width: 1300px; margin: 0 auto; }
  .footer-recommend { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .footer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .footer-bottom img { height: 28px; }
  .footer-links { display: flex; gap: 24px; font-size: 13px; color: var(--muted); }
  .footer-copy { font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    nav { display: none; }
    .burger { display: block; }
    .legal-content h1 { font-size: 28px; }
    .footer-bottom { flex-direction: column; align-items: flex-start; }
    .nav-wrap.nav-open nav {
      display: block;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 16px 24px;
      z-index: 200;
    }
    .nav-wrap.nav-open nav ul {
      flex-direction: column;
      gap: 18px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a class="logo" href="index.html"><img src="images/logo-transparent.png" alt="Logo"></a>
    <nav>
      <ul>
        <li><a href="index.html">Startseite</a></li>
        <li><a href="creators.html">Creator</a></li>
        <li><a href="contact.html">Kontakt</a></li>
      </ul>
    </nav>
    <button class="burger">☰</button>
  </div>
</header>

<section class="legal-content">
  <div class="eyebrow">Rechtliches</div>
  <h1>Impressum</h1>
  <p>Diese Seite wird in Kürze mit den vollständigen Impressumsangaben befüllt.</p>
</section>

<footer>
  <div class="footer-inner">
    <p class="footer-recommend">Interessiert an einer Zusammenarbeit? Schreib uns über das Formular oder an support@netpd.de.</p>
    <div class="footer-bottom">
      <img src="images/logo-transparent.png" alt="Logo">
      <div class="footer-links">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </div>
      <div class="footer-copy">© 2026 Creator Hub</div>
    </div>
  </div>
</footer>

<script>
  const burgerBtn = document.querySelector('.burger');
  const navWrap = document.querySelector('.nav-wrap');
  if (burgerBtn && navWrap) {
    burgerBtn.addEventListener('click', () => {
      const isOpen = navWrap.classList.toggle('nav-open');
      burgerBtn.textContent = isOpen ? '✕' : '☰';
    });
    navWrap.querySelectorAll('nav a').forEach((link) => {
      link.addEventListener('click', () => {
        navWrap.classList.remove('nav-open');
        burgerBtn.textContent = '☰';
      });
    });
  }
</script>

</body>
</html>
